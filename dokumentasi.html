<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#493222">
  <meta
    name="description"
    content="Dokumentasi naskah dan karya tulis Kawruh Urip tentang kehidupan, jati diri, kesadaran, dan kasunyatan."
  >

  <title>Dokumentasi | Kawruh Urip</title>

  <link rel="stylesheet" href="style.css?v=5">

  <style>
    .dokumentasi-wrap {
      width: min(100% - 28px, 1000px);
      margin: 24px auto;
      padding-bottom: 32px;
      line-height: 1.8;
    }

    .dokumentasi-panel {
      padding: 24px;
    }

    .judul-dokumentasi {
      margin: 0 0 18px;
      padding-bottom: 12px;
      color: #493222;
      font-size: clamp(1.45rem, 4vw, 2rem);
      border-bottom: 1px solid #b69a6a;
    }

    .pengantar-dokumentasi {
      margin-bottom: 20px;
      padding: 20px;
      color: #493222;
      background: #fffaf0;
      border: 1px solid #d2bd98;
      border-radius: 8px;
    }

    .pengantar-dokumentasi p {
      margin: 0;
      text-align: justify;
    }

    .status-dokumentasi {
      padding: 20px;
      color: #493222;
      background: #f2e7d2;
      border: 1px solid #c7a66a;
      border-radius: 8px;
    }

    .status-dokumentasi h3 {
      margin-top: 0;
      color: #65472e;
    }

    .status-dokumentasi p {
      margin-bottom: 0;
      text-align: justify;
    }

    .kembali-beranda {
      display: inline-block;
      margin-top: 24px;
      padding: 9px 15px;
      color: #fffaf0;
      background: #493222;
      border: 1px solid #493222;
      border-radius: 5px;
      text-decoration: none;
    }

    .kembali-beranda:hover {
      color: #ffffff;
      background: #76532f;
    }

    @media (max-width: 560px) {
      .dokumentasi-panel {
        padding: 18px;
      }

      .pengantar-dokumentasi,
      .status-dokumentasi {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- KEPALA HALAMAN -->
  <header class="site-header">
    <div class="header-shade" aria-hidden="true"></div>

    <div class="header-content">
      <p class="eyebrow">PAMAPARAN BAB URIP LAN KASUNYATAN</p>

      <h1>KAWRUH URIP</h1>
      <div id="navigasi-container"></div>
    </div>
  </header>

  <!-- ISI DOKUMENTASI -->
  <main class="page-wrap dokumentasi-wrap">

    <section class="content-card dokumentasi-panel">

      <h2 class="judul-dokumentasi">
        Dokumentasi Kawruh Urip
      </h2>
      <p><a href="https://drive.google.com/file/d/1dtRAD3M4kKPKtTZqC5NdCJNDqpuX0SeI/view?usp=drivesdk">Rasa Sejati Dalam Kawruh Uttamopadesa</a></p>

      <a class="kembali-beranda" href="index.html#beranda">
        ← Kembali ke Beranda
      </a>

    </section>

  </main>

  <!-- FOOTER -->
  <div id="footer-container"></div>

  <!-- TOMBOL KEMBALI KE ATAS -->
  <button
    id="backToTop"
    class="back-to-top"
    type="button"
    aria-label="Kembali ke atas"
  >↑</button>

  <!-- JAVASCRIPT -->
  <script src="navigasi.js"></script>
  <script src="footer.js"></script>
  <script src="script.js"></script>

</body>
</html>
